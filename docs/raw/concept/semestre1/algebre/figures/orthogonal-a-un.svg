<text x="313.9" y="344.7" text-anchor="middle" font-size="14" fill="#a9a89e" font-family="Georgia,serif" font-style="italic">e<tspan dy="4" font-size="10" font-style="normal" font-family="ui-monospace,Consolas,monospace">1</tspan></text>
<line x1="450.0" y1="390.0" x2="622.0" y2="358.8" stroke="#a9a89e" stroke-width="1.2" opacity="1.0"/>
<text x="644.4" y="359.8" text-anchor="middle" font-size="14" fill="#a9a89e" font-family="Georgia,serif" font-style="italic">e<tspan dy="4" font-size="10" font-style="normal" font-family="ui-monospace,Consolas,monospace">2</tspan></text>
<line x1="450.0" y1="390.0" x2="450.0" y2="187.2" stroke="#a9a89e" stroke-width="1.2" opacity="1.0"/>
<text x="450.0" y="165.8" text-anchor="middle" font-size="14" fill="#a9a89e" font-family="Georgia,serif" font-style="italic">e<tspan dy="4" font-size="10" font-style="normal" font-family="ui-monospace,Consolas,monospace">3</tspan></text>
<text x="696.2" y="523.4" font-size="16" fill="#8b5cd6" text-anchor="end" font-weight="600" font-family="Georgia,serif">H = Vect(1)⊥</text>
<text x="696.2" y="541.4" font-size="12" fill="#8b5cd6" text-anchor="end">somme nulle · moyenne nulle</text>
<line x1="450.0" y1="390.0" x2="501.6" y2="111.5" stroke="#2a78d6" stroke-width="2.0" opacity="0.8"/>
<text x="511.6" y="115.5" font-size="16" fill="#2a78d6" font-weight="600" font-family="Georgia,serif">Vect(1)</text>
<line x1="484.4" y1="204.3" x2="679.4" y2="213.2" stroke="#52514e" stroke-width="1.2" opacity="1.0" stroke-dasharray="4 3"/>
