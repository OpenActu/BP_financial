<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="ui-monospace,Consolas,monospace">
<rect width="900" height="680" fill="#fcfcfb"/>
<text x="40.0" y="34.0" font-size="19" fill="#0b0b0b" font-weight="600" font-family="Georgia,serif">E5.2 — les vecteurs orthogonaux à 1 sont les vecteurs centrés</text>
<text x="40.0" y="56.0" font-size="12" fill="#52514e">dans ℝ³ · H = { u : u₁ + u₂ + u₃ = 0 } est le plan orthogonal à la droite Vect(1)</text>
<line x1="450.0" y1="390.0" x2="422.3" y2="539.5" stroke="#2a78d6" stroke-width="2.0" opacity="0.6" stroke-dasharray="5 4"/>
