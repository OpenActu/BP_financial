<polygon points="647.4,385.9 644.0,374.1 654.8,376.1" fill="#52514e"/>
<text x="672.2" y="300.1" font-size="13" fill="#52514e">− x̄ 1 = − 2 · 1</text>
<polyline points="453.5,371.2 477.6,372.3 474.1,391.1" fill="none" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="450.0" y1="390.0" x2="481.8" y2="218.1" stroke="#2a78d6" stroke-width="2.6" opacity="1.0"/>
<polygon points="484.4,204.3 487.2,219.1 476.4,217.1" fill="#2a78d6"/>
<line x1="450.0" y1="390.0" x2="631.0" y2="398.3" stroke="#eb6834" stroke-width="2.6" opacity="1.0"/>
<polygon points="645.0,398.9 630.7,403.8 631.2,392.8" fill="#eb6834"/>
<line x1="450.0" y1="390.0" x2="668.3" y2="221.8" stroke="#0b0b0b" stroke-width="2.6" opacity="1.0"/>
<polygon points="679.4,213.2 671.6,226.1 664.9,217.4" fill="#0b0b0b"/>
<text x="691.4" y="209.2" font-size="16" fill="#0b0b0b" font-weight="600" font-family="Georgia,serif">x = (0, 4, 2)</text>
<text x="444.4" y="209.3" font-size="15" fill="#2a78d6" text-anchor="end" font-weight="600" font-family="Georgia,serif">x̄ 1 = (2, 2, 2)</text>
<text x="639.0" y="424.9" font-size="16" fill="#eb6834" text-anchor="end" font-weight="600" font-family="Georgia,serif">x̃ = (−2, 2, 0)</text>
<circle cx="450.0" cy="390.0" r="3.2" fill="#0b0b0b"/>
<text x="442.0" y="407.0" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">0</text>
<text x="450.0" y="632.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">⟨x̃, 1⟩ = (−2) + 2 + 0 = 0 : x̃ ∈ H, et tout u ∈ H est son propre centré</text>
<text x="450.0" y="652.0" font-size="13" fill="#52514e" text-anchor="middle">centrer, c'est glisser parallèlement à 1 jusqu'à H — une équation, une dimension de moins : dim H = 3 − 1 = 2</text>
</svg>
