<text x="40.0" y="34.0" font-size="19" fill="#0b0b0b" font-weight="600" font-family="Georgia,serif">4.2 — Vect(u, v) : un plan, ou seulement une droite</text>
<text x="40.0" y="56.0" font-size="12" fill="#52514e">dans ℝ³ · le même u dans les deux panneaux, seul v change · points : les 9 combinaisons λu + μv, λ et μ parcourant {−1, 0, 1}</text>
